<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script><style>:root{--ink:#172033;--muted:#738095;--line:#e8edf3;--panel:#fff;--soft:#f6f8fb;--blue:#315efb;--goal:#8b95a7;--good:#14804a;--bad:#c13c3c}*{box-sizing:border-box}html,body{margin:0;background:transparent;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}.card{width:100%;min-height:650px;padding:22px 24px;border:1px solid var(--line);border-radius:16px;background:var(--panel);box-shadow:0 8px 28px rgba(18,32,56,.06)}.eyebrow{font-size:11px;font-weight:750;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}h1{font-size:20px;margin:5px 0 16px}.kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}.kpi{background:var(--soft);border:1px solid var(--line);border-radius:11px;padding:9px 12px;min-width:120px}.kpi b{display:block;font-size:18px}.kpi span,.note{font-size:11px;color:var(--muted)}.positive{color:var(--good)}.negative{color:var(--bad)}.wrap{height:500px;position:relative}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}select{border:1px solid #d9e0e9;border-radius:9px;padding:8px 11px;background:#fff;color:var(--ink);font-weight:600}@media(max-width:520px){.card{padding:14px;min-height:540px}.wrap{height:420px}}</style></head><body><section class="card"><div class="eyebrow">ISTO · Bienestar</div><h1>Balance de bienestar por círculos</h1><div class="toolbar"><select id="month"></select><div class="note">Meta · 70%</div></div><div class="wrap"><canvas id="chart"></canvas></div><div class="note">Cada punta representa un círculo. El día en curso no se incluye.</div></section><script>
const META=70;fetch('data-seguimiento-bienestar.json?'+Date.now()).then(r=>r.json()).then(d=>{const sel=document.getElementById('month');[...d.items].reverse().forEach(x=>{const o=document.createElement('option');o.value=x.key;o.textContent=x.mes+' '+x.anio;sel.appendChild(o)});let c;function draw(key){const row=d.items.find(x=>x.key===key);if(!row)return;if(c)c.destroy();c=new Chart(chart,{type:'radar',data:{labels:d.circulos,datasets:[{label:'Bienestar',data:d.circulos.map(x=>row.circulos[x]),borderColor:'#315efb',backgroundColor:'rgba(49,94,251,.14)',borderWidth:2.5,pointRadius:6,pointHoverRadius:8,pointBackgroundColor:'#315efb',pointBorderColor:'#fff',pointBorderWidth:2},{label:'Meta 70%',data:d.circulos.map(()=>META),borderColor:'#8b95a7',backgroundColor:'rgba(139,149,167,.025)',borderWidth:1.5,borderDash:[6,5],pointRadius:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top',align:'end',labels:{usePointStyle:true,boxWidth:8}},tooltip:{callbacks:{label:x=>' '+x.dataset.label+': '+x.raw+'%'}}},scales:{r:{min:0,max:100,beginAtZero:true,ticks:{stepSize:10,showLabelBackdrop:false,font:{size:11},callback:v=>v+'%',color:'#8b95a7'},grid:{color:'#e4e9f0'},angleLines:{color:'#e4e9f0'},pointLabels:{color:'#172033',font:{size:15,weight:'700'}}}}}})}sel.onchange=()=>draw(sel.value);if(sel.options.length)draw(sel.value)}).catch(()=>document.querySelectorAll('.note')[1].textContent='No se pudieron cargar los datos.');</script></body></html>
