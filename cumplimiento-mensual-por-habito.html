<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script><style>html,body{margin:0;background:transparent;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#37352f}.card{box-sizing:border-box;width:100%;min-height:360px;padding:18px;border:1px solid #e9e9e7;border-radius:14px;background:#fff}.title{font-size:18px;font-weight:650;margin:0 0 3px}.sub{font-size:12px;color:#787774;margin-bottom:14px}.wrap{position:relative;height:285px}select{border:1px solid #deddd9;border-radius:8px;padding:7px 10px;background:white;color:#37352f;margin-bottom:12px} @media(prefers-color-scheme:dark){body{color:#e7e7e5}.card{background:#191919;border-color:#333}.sub{color:#aaa}select{background:#252525;color:#eee;border-color:#444}}</style></head><body><div class="card"><div class="title">Cumplimiento mensual por hábito</div><div class="sub">Selecciona un hábito para ver su evolución</div><select id="habit"></select><div class="wrap"><canvas id="c"></canvas></div></div><script>
fetch('data-seguimiento-habitos.json?'+Date.now()).then(r=>r.json()).then(d=>{
 const sel=document.getElementById('habit'); d.habitos.forEach(h=>{const o=document.createElement('option');o.value=o.textContent=h;sel.appendChild(o)});
 const labels=d.items.map(x=>x.mes+' '+x.anio); let chart;
 function draw(h){if(chart)chart.destroy();chart=new Chart(document.getElementById('c'),{type:'line',data:{labels,datasets:[{label:h,data:d.items.map(x=>x.habitos[h]),borderWidth:3,tension:.3,pointRadius:4,pointHoverRadius:6,fill:false}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' '+h+': '+c.parsed.y+'%'}}},scales:{y:{min:0,max:100,ticks:{callback:v=>v+'%'},grid:{color:'rgba(128,128,128,.12)'}},x:{grid:{display:false}}}}})}
 sel.onchange=()=>draw(sel.value); draw(d.habitos[0]);
}).catch(()=>document.querySelector('.sub').textContent='No se pudieron cargar los datos.');</script></body></html>
