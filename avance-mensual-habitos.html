<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avance Mensual de Hábitos</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; background: #000; color: #fff; font-family: Inter, Arial, sans-serif; }
    .card { width: 100%; height: 430px; padding: 22px; background: #000; }
    .chart-wrap { position: relative; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <main class="card">
    <div class="chart-wrap"><canvas id="habitosChart"></canvas></div>
  </main>
<script>
const datos = [
  { mes: 'Septiembre', meta: 70, real: 55 }
];

const ctx = document.getElementById('habitosChart');
Chart.defaults.color = '#d4d4d4';
Chart.defaults.borderColor = 'rgba(255,255,255,.12)';

new Chart(ctx, {
  type: 'line',
  data: {
    labels: datos.map(d => d.mes),
    datasets: [
      {
        label: 'Meta',
        data: datos.map(d => d.meta),
        borderColor: '#60a5fa',
        backgroundColor: '#60a5fa',
        borderWidth: 3,
        pointRadius: 5,
        pointHoverRadius: 7,
        tension: .3
      },
      {
        label: 'Real',
        data: datos.map(d => d.real),
        borderColor: '#34d399',
        backgroundColor: '#34d399',
        borderWidth: 3,
        pointRadius: 5,
        pointHoverRadius: 7,
        tension: .3
      }
    ]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    interaction: { mode: 'index', intersect: false },
    plugins: {
      title: { display: true, text: 'Avance Mensual de Hábitos', color: '#fff', font: { size: 20, weight: '600' }, padding: { bottom: 20 } },
      legend: { labels: { color: '#e5e7eb', usePointStyle: true, padding: 18 } },
      tooltip: { callbacks: { label: c => `${c.dataset.label}: ${c.parsed.y}%` } }
    },
    scales: {
      x: { grid: { color: 'rgba(255,255,255,.08)' }, ticks: { color: '#a3a3a3' } },
      y: { beginAtZero: true, max: 100, grid: { color: 'rgba(255,255,255,.10)' }, ticks: { color: '#a3a3a3', callback: v => v + '%' } }
    }
  }
});
</script>
</body>
</html>
