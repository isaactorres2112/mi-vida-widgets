<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avance Mensual de Hábitos</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; background: #000; color: #fff; font-family: Inter, Arial, sans-serif; }
    .card { width: 100%; height: 430px; padding: 22px; background: #000; }
    .chart-wrap { position: relative; width: 100%; height: 100%; }
    .status { position: absolute; inset: 0; display: grid; place-items: center; color: #a3a3a3; font-size: 14px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="chart-wrap">
      <canvas id="habitosChart"></canvas>
      <div id="status" class="status">Cargando datos…</div>
    </div>
  </main>
<script>
const ctx = document.getElementById('habitosChart');
const status = document.getElementById('status');
Chart.defaults.color = '#d4d4d4';
Chart.defaults.borderColor = 'rgba(255,255,255,.12)';

function nombreMes(valor) {
  const partes = String(valor || '').split('.', 2);
  return partes.length === 2 ? partes[1] : String(valor || '');
}

async function cargarGrafica() {
  try {
    const response = await fetch('./data.json?v=' + Date.now(), { cache: 'no-store' });
    if (!response.ok) throw new Error('No se pudo cargar data.json');
    const payload = await response.json();
    const datos = Array.isArray(payload.items) ? payload.items : [];
    if (!datos.length) throw new Error('No hay datos disponibles');
    status.style.display = 'none';

    new Chart(ctx, {
      type: 'line',
      data: {
        labels: datos.map(d => nombreMes(d.mes)),
        datasets: [
          {
            label: 'Meta',
            data: datos.map(d => d.meta),
            borderColor: '#60a5fa',
            backgroundColor: '#60a5fa',
            borderWidth: 3,
            pointRadius: 5,
            pointHoverRadius: 7,
            tension: .3,
            spanGaps: true
          },
          {
            label: 'Real',
            data: datos.map(d => d.real),
            borderColor: '#34d399',
            backgroundColor: '#34d399',
            borderWidth: 3,
            pointRadius: 5,
            pointHoverRadius: 7,
            tension: .3,
            spanGaps: true
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          title: { display: true, text: 'Avance Mensual de Hábitos', color: '#fff', font: { size: 20, weight: '600' }, padding: { bottom: 20 } },
          legend: { labels: { color: '#e5e7eb', usePointStyle: true, padding: 18 } },
          tooltip: { callbacks: { label: c => `${c.dataset.label}: ${c.parsed.y}%` } }
        },
        scales: {
          x: { grid: { color: 'rgba(255,255,255,.08)' }, ticks: { color: '#a3a3a3' } },
          y: { beginAtZero: true, max: 100, grid: { color: 'rgba(255,255,255,.10)' }, ticks: { color: '#a3a3a3', callback: v => v + '%' } }
        }
      }
    });
  } catch (error) {
    status.textContent = 'No fue posible cargar los datos.';
    console.error(error);
  }
}

cargarGrafica();
</script>
</body>
</html>
