name: Sincronizar hábitos desde Notion

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Leer Notion y generar data.json
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DATA_SOURCE_ID: 3b701ec1-e57b-803b-967d-000b742c9cfb
        run: |
          python - <<'PY'
          import json, os, urllib.request

          url = f"https://api.notion.com/v1/data_sources/{os.environ['DATA_SOURCE_ID']}/query"
          req = urllib.request.Request(url, data=b'{}', method='POST', headers={
              'Authorization': f"Bearer {os.environ['NOTION_TOKEN']}",
              'Notion-Version': '2026-03-11',
              'Content-Type': 'application/json'
          })
          with urllib.request.urlopen(req) as r:
              payload = json.load(r)

          items = []
          for page in payload.get('results', []):
              p = page.get('properties', {})
              months = [x.get('name','') for x in p.get('Mes', {}).get('multi_select', [])]
              meta = p.get('Meta', {}).get('number')
              real = p.get('Real', {}).get('number')
              for month in months:
                  items.append({
                      'mes': month,
                      'meta': None if meta is None else round(meta * 100, 2),
                      'real': None if real is None else round(real * 100, 2)
                  })

          def order(x):
              try: return int(x['mes'].split('.',1)[0])
              except: return 99
          items.sort(key=order)

          with open('data.json','w',encoding='utf-8') as f:
              json.dump({'items': items}, f, ensure_ascii=False, indent=2)
          PY

      - name: Guardar cambios
        run: |
          git add data.json
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Actualizar datos de hábitos desde Notion"
          git push
