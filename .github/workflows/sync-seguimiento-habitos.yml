name: Sincronizar seguimiento de hábitos desde Notion

on:
  workflow_dispatch:
  schedule:
    - cron: '37 * * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Leer Notion y generar data-seguimiento-habitos.json
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DATA_SOURCE_ID: 3b401ec1-e57b-80a1-a29e-000b303d2775
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from collections import defaultdict
          from datetime import datetime

          habits = ['Dormir','Salud','Ejercicio','Orar','Ahorrar','Leer','Agua','Uñas','Tocarse','Animo']
          url = f"https://api.notion.com/v1/data_sources/{os.environ['DATA_SOURCE_ID']}/query"
          results, cursor = [], None

          while True:
              body = {} if not cursor else {'start_cursor': cursor}
              req = urllib.request.Request(url, data=json.dumps(body).encode(), method='POST', headers={
                  'Authorization': f"Bearer {os.environ['NOTION_TOKEN']}",
                  'Notion-Version': '2026-03-11',
                  'Content-Type': 'application/json'
              })
              with urllib.request.urlopen(req) as r:
                  payload = json.load(r)
              results.extend(payload.get('results', []))
              if not payload.get('has_more'): break
              cursor = payload.get('next_cursor')

          monthly = defaultdict(lambda: {h:{'done':0,'days':0} for h in habits})
          for page in results:
              p = page.get('properties', {})
              date = (p.get('Fecha', {}).get('date') or {}).get('start')
              if not date: continue
              try: dt = datetime.fromisoformat(date[:10])
              except: continue
              key = dt.strftime('%Y-%m')
              for h in habits:
                  monthly[key][h]['days'] += 1
                  if p.get(h, {}).get('checkbox') is True:
                      monthly[key][h]['done'] += 1

          months_es=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre']
          items=[]
          for key in sorted(monthly):
              y,m=map(int,key.split('-'))
              row={'key':key,'mes':months_es[m-1],'anio':y,'habitos':{}}
              for h,v in monthly[key].items():
                  row['habitos'][h]=round(v['done']*100/v['days'],1) if v['days'] else None
              items.append(row)

          with open('data-seguimiento-habitos.json','w',encoding='utf-8') as f:
              json.dump({'habitos':habits,'items':items},f,ensure_ascii=False,indent=2)
          PY

      - name: Guardar cambios
        run: |
          git add data-seguimiento-habitos.json
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Actualizar seguimiento mensual de hábitos"
          git push
