<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Evolución de Hábitos</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#05070a;color:#f8fafc;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.dashboard{min-height:520px;padding:26px;background:radial-gradient(circle at 85% 0%,rgba(59,130,246,.10),transparent 28%),#05070a}.header{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:20px}.eyebrow{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#64748b;margin-bottom:7px}h1{font-size:23px;margin:0;font-weight:650}.subtitle{margin-top:6px;color:#64748b;font-size:13px}.live{display:flex;align-items:center;gap:7px;color:#94a3b8;font-size:11px}.dot{width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 12px rgba(34,197,94,.7)}.controls{display:flex;align-items:end;gap:12px;margin-bottom:16px}.field{min-width:220px}.field label{display:block;font-size:11px;color:#64748b;margin-bottom:6px}.field select{width:100%;background:#0f172a;color:#e2e8f0;border:1px solid rgba(148,163,184,.18);border-radius:10px;padding:10px 12px;font-size:13px;outline:none}.kpi{margin-left:auto;text-align:right}.kpi-label{font-size:11px;color:#64748b}.kpi-value{font-size:25px;font-weight:700;margin-top:2px}.chart-card{height:350px;background:linear-gradient(180deg,rgba(15,23,42,.66),rgba(7,10,15,.88));border:1px solid rgba(148,163,184,.13);border-radius:18px;padding:18px;position:relative}.chart-wrap{height:300px}.status{position:absolute;inset:0;display:grid;place-items:center;color:#64748b;font-size:13px}.footer{display:flex;justify-content:space-between;margin-top:11px;font-size:10px;color:#475569}@media(max-width:650px){.dashboard{padding:18px}.header,.controls{flex-direction:column}.field{width:100%;min-width:0}.kpi{margin-left:0;text-align:left}.chart-card{height:370px}.chart-wrap{height:320px}}
</style></head><body><main class="dashboard"><header class="header"><div><div class="eyebrow">Performance dashboard</div><h1>Evolución Mensual de Hábitos</h1><div class="subtitle">Cumplimiento mensual por hábito</div></div><div class="live"><span class="dot"></span>Sincronizado con Notion</div></header><section class="controls"><div class="field"><label for="habit">Hábito a visualizar</label><select id="habit"></select></div><div class="kpi"><div class="kpi-label">Último resultado</div><div class="kpi-value" id="actual">—</div></div></section><section class="chart-card"><div class="chart-wrap"><canvas id="chart"></canvas></div><div id="status" class="status">Cargando datos…</div></section><div class="footer"><span>Escala 0–100%</span><span id="updated">Actualizando…</span></div></main>
<script>
const sel=document.getElementById('habit'),status=document.getElementById('status'),actual=document.getElementById('actual');let payload,chart;
function render(){const h=sel.value,d=payload.items,vals=d.map(x=>x.habitos[h]);actual.textContent=vals.length&&vals.at(-1)!=null?vals.at(-1)+'%':'—';if(chart)chart.destroy();const ctx=document.getElementById('chart');chart=new Chart(ctx,{type:'bar',data:{labels:d.map(x=>x.mes+(d.length>12?' '+x.anio:'')),datasets:[{label:h,data:vals,backgroundColor:'rgba(52,211,153,.68)',borderColor:'#34d399',borderWidth:1,borderRadius:7,maxBarThickness:58}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{backgroundColor:'#111827',titleColor:'#f8fafc',bodyColor:'#cbd5e1',borderColor:'rgba(148,163,184,.2)',borderWidth:1,padding:12,callbacks:{label:c=>h+': '+c.parsed.y+'%'}}},scales:{x:{border:{display:false},grid:{display:false},ticks:{color:'#64748b'}},y:{min:0,max:100,border:{display:false},grid:{color:'rgba(148,163,184,.08)'},ticks:{stepSize:25,color:'#64748b',callback:v=>v+'%'}}}}});}
async function load(){try{const r=await fetch('./data-seguimiento-habitos.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;payload=await r.json();if(!payload.items?.length)throw 0;sel.innerHTML=payload.habitos.map(h=>'<option>'+h+'</option>').join('');sel.addEventListener('change',render);status.style.display='none';document.getElementById('updated').textContent='Datos actualizados automáticamente';render()}catch(e){status.textContent='No fue posible cargar los datos.';document.getElementById('updated').textContent='Sin datos'}}load();
</script></body></html>
