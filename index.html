<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Vida · Fecha de hoy</title>
  <style>
    :root {
      color-scheme: light dark;
      --text: #37352f;
      --muted: #787774;
      --line: rgba(55,53,47,.12);
      --bg: transparent;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --text: #f1f1ef;
        --muted: #a9a9a6;
        --line: rgba(255,255,255,.12);
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: var(--bg); }
    body {
      min-height: 180px;
      display: grid;
      place-items: center;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
    }
    .widget {
      width: min(100%, 900px);
      padding: 24px 28px;
      text-align: center;
    }
    .weekday {
      margin: 0 0 7px;
      font-size: clamp(12px, 2vw, 15px);
      font-weight: 650;
      letter-spacing: .22em;
      color: var(--muted);
    }
    .date {
      margin: 0;
      font-size: clamp(30px, 7vw, 58px);
      line-height: 1.05;
      font-weight: 720;
      letter-spacing: -0.045em;
    }
    .year {
      display: inline-block;
      margin-top: 12px;
      padding-top: 10px;
      min-width: 72px;
      border-top: 1px solid var(--line);
      font-size: clamp(12px, 2vw, 15px);
      font-weight: 550;
      letter-spacing: .16em;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="widget" aria-label="Fecha de hoy">
    <p class="weekday" id="weekday"></p>
    <h1 class="date" id="date"></h1>
    <span class="year" id="year"></span>
  </main>
  <script>
    const weekday = document.getElementById('weekday');
    const date = document.getElementById('date');
    const year = document.getElementById('year');

    function renderDate() {
      const now = new Date();
      const dayName = new Intl.DateTimeFormat('es-MX', { weekday: 'long' }).format(now);
      const day = new Intl.DateTimeFormat('es-MX', { day: 'numeric' }).format(now);
      const month = new Intl.DateTimeFormat('es-MX', { month: 'long' }).format(now);

      weekday.textContent = dayName.toLocaleUpperCase('es-MX');
      date.textContent = `${day} DE ${month.toLocaleUpperCase('es-MX')}`;
      year.textContent = String(now.getFullYear());
      document.title = `${dayName} ${day} de ${month} · Mi Vida`;
    }

    renderDate();
    setInterval(renderDate, 60 * 1000);
  </script>
</body>
</html>
